
name: Project 16 - CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "14 - Container Engineering & AWS/project/**"
      - ".github/workflows/project16-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "14 - Container Engineering & AWS/project/**"
      - ".github/workflows/project16-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Flask Application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "14 - Container Engineering & AWS/project"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m unittest discover -s tests -v
