AWSTemplateFormatVersion: '2010-09-09'
Description: 'Serverless Event-Driven Data Processing Pipeline (IaC)'

Resources:
  # 1. IAM Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess

  # 2. Serverless Lambda Function
  ProcessingLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'serverless-processor-${AWS::StackName}'
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Architectures:
        - x86_64
      Timeout: 30
      Code:
        ZipFile: |
          import json
          import logging
          import datetime
          import urllib.parse
          import boto3

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          s3_client = boto3.client('s3')

          def lambda_handler(event, context):
              execution_time = datetime.datetime.now(datetime.timezone.utc).isoformat()
              logger.info(f"=== LAMBDA EXECUTION STARTED AT {execution_time} ===")

              try:
                  if 'Records' in event and len(event['Records']) > 0 and 's3' in event['Records'][0]:
                      s3_record = event['Records'][0]['s3']
                      bucket_name = s3_record['bucket']['name']
                      file_key = urllib.parse.unquote_plus(s3_record['object']['key'], encoding='utf-8')
                      file_size = s3_record['object'].get('size', 0)

                      logger.info(f"[S3 TRIGGER DETECTED] File: {file_key} | Bucket: {bucket_name} | Size: {file_size} bytes")

                      if file_key.endswith('.json'):
                          response = s3_client.get_object(Bucket=bucket_name, Key=file_key)
                          content = response['Body'].read().decode('utf-8')
                          data = json.loads(content)
                          logger.info(f"File content parsed successfully: {data}")

                      response_body = {
                          "status": "S3 Event Processed Successfully via CloudFormation Stack",
                          "bucket": bucket_name,
                          "file": file_key,
                          "timestamp": execution_time
                      }
                  else:
                      logger.info("Manual invocation payload received.")
                      response_body = {
                          "status": "Manual Execution Processed",
                          "received_payload": event,
                          "timestamp": execution_time
                      }

                  logger.info(f"Execution Summary: {json.dumps(response_body)}")
                  return {
                      'statusCode': 200,
                      'headers': {'Content-Type': 'application/json'},
                      'body': json.dumps(response_body)
                  }
              except Exception as e:
                  logger.error(f"Execution failed: {str(e)}")
                  raise e

  # 3. Invocation Permission for S3
  LambdaS3InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt ProcessingLambdaFunction.Arn
      Principal: s3.amazonaws.com
      SourceArn: !Sub 'arn:aws:s3:::serverless-processor-data-${AWS::AccountId}-${AWS::Region}'

  # 4. S3 Storage Bucket with Event Notification Trigger
  SourceS3Bucket:
    Type: AWS::S3::Bucket
    DependsOn: LambdaS3InvokePermission
    Properties:
      BucketName: !Sub 'serverless-processor-data-${AWS::AccountId}-${AWS::Region}'
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt ProcessingLambdaFunction.Arn

Outputs:
  S3BucketName:
    Description: Automated S3 Data Bucket Name
    Value: !Ref SourceS3Bucket
  LambdaFunctionArn:
    Description: Deployed Lambda Function ARN
    Value: !GetAtt ProcessingLambdaFunction.Arn
